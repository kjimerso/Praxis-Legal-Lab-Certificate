name: Rebuild site

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build verification pages
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node scripts/build-site.js

      - name: Commit and push
        run: |
          git config user.name "praxis-cert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/verify
          git commit -m "Rebuild certificate pages" || echo "Nothing to commit"
          git push
