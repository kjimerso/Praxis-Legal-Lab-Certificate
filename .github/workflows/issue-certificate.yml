name: Issue certificate

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  issue-certificate:
    if: contains(github.event.issue.labels.*.name, 'certificate-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add certificate record
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/process-issue.js

      - name: Build verification pages
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node scripts/build-site.js

      - name: Commit and push
        run: |
          git config user.name "praxis-cert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/certificates.json docs/verify
          git commit -m "Issue certificate from #${{ github.event.issue.number }}" || echo "Nothing to commit"
          git push

      - name: Comment with links and close
        uses: actions/github-script@v7
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        with:
          script: |
            const fs = require('fs');
            const records = JSON.parse(fs.readFileSync('data/certificates.json', 'utf8'));
            const rec = records[records.length - 1];
            const verifyUrl = `${process.env.SITE_URL}/verify/${rec.certId}.html`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Certificate **${rec.certId}** issued for ${rec.studentName}.\n\n**Verification page:** ${verifyUrl}\n\nSend that link to the student — it has their "Add to LinkedIn" button on it.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
